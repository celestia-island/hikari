name: CI (GitHub-hosted fallback)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: fmt + clippy + test (hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  # The Vue/TS half of the library (packages/vue) ships as TS source and
  # is gated locally by vitest + vue-tsc on every change — but until this
  # job existed, NO CI workflow ever ran that suite (the `just test` lane
  # is cargo-only), so regression coverage existed only on the author's
  # machine. happy-dom keeps it browser-free; the frozen install is the
  # same proven shape the npm-release workflow uses for this directory.
  web-test:
    name: "web: vitest + vue-tsc (hosted)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/vue/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: packages/vue
        run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        working-directory: packages/vue
        run: pnpm exec vitest run
      - name: Type check (vue-tsc)
        working-directory: packages/vue
        run: pnpm exec vue-tsc --noEmit
