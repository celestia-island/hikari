name: Web Tests (hosted)

# Sole CI coverage for packages/vue (vitest + vue-tsc) — the farm's cargo
# lanes (Format / Clippy / Run Tests) and the CNB overflow lane cover the Rust
# half, so the former all-in-one "CI (GitHub-hosted fallback)" lint-test job
# was pure duplication and was removed on 2026-09-23 (user-approved narrowing).
# Paths are restricted to the web subtree: Rust-only changes never touch it.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "packages/vue/**"
      - ".github/workflows/ci-hosted.yml"
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "packages/vue/**"
      - ".github/workflows/ci-hosted.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-test:
    name: "web: vitest + vue-tsc (hosted)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/vue/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: packages/vue
        run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        working-directory: packages/vue
        run: pnpm exec vitest run
      - name: Type check (vue-tsc)
        working-directory: packages/vue
        run: pnpm exec vue-tsc --noEmit
