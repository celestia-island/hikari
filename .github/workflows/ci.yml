---
name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-versions:
    name: Verify version consistency
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@master

  family-versions:
    name: Family dependency identity
    uses: celestia-island/celestia-devtools/.github/workflows/family-versions.yml@master

  rustfmt:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Check Formatting
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install apt dependencies
        run: sudo apt-get install -y libasound2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt -- --check
        run: cargo +nightly fmt --all -- --check --unstable-features

  lint:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Lint
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install apt dependencies
        run: sudo apt-get install -y libasound2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Run cargo clippy
        run: cargo clippy --all --all-features
        env:
          RUSTFLAGS: '--cfg releasing'

      - name: Lint wasm32-wasip2 target
        run: cargo clippy --workspace --exclude hikari-render-service --exclude hikari-e2e --all-features --target wasm32-wasip2
        env:
          RUSTFLAGS: '--cfg releasing'

  test:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Run tests
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install apt dependencies
        run: sudo apt-get install -y libasound2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Run cargo test
        run: cargo test --all-features --all
        env:
          RUSTFLAGS: '--cfg releasing'

      - name: Check wasm32-wasip2 target
        run: cargo check --workspace --exclude hikari-render-service --exclude hikari-e2e --all-features --target wasm32-wasip2
        env:
          RUSTFLAGS: '--cfg releasing'
