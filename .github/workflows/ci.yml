---
name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-versions:
    name: Verify version consistency
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@2e76d373762dc6b36c1ab7625c1c34842c28ad4a
    with:
      devtools-ref: 2e76d373762dc6b36c1ab7625c1c34842c28ad4a


  type-escapes:
    name: Type escape hatches
    uses: celestia-island/celestia-devtools/.github/workflows/type-escapes.yml@46e95519848940ebbaae60023dc03bb7a114c5ec
    with:
      devtools-ref: 46e95519848940ebbaae60023dc03bb7a114c5ec
  family-versions:
    name: Family dependency identity
    uses: celestia-island/celestia-devtools/.github/workflows/family-versions.yml@2e76d373762dc6b36c1ab7625c1c34842c28ad4a
    with:
      devtools-ref: 2e76d373762dc6b36c1ab7625c1c34842c28ad4a

  rustfmt:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Check Formatting
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install apt dependencies
        run: sudo apt-get install -y libasound2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt -- --check
        run: cargo +nightly fmt --all -- --check --unstable-features

  lint:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Lint
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install apt dependencies
        run: sudo apt-get install -y libasound2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Run cargo clippy
        run: cargo clippy --all --all-features
        env:
          RUSTFLAGS: '--cfg releasing'

      - name: Lint wasm32-wasip2 target
        run: cargo clippy --workspace --all-features --target wasm32-wasip2
        env:
          RUSTFLAGS: '--cfg releasing'

  test:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Run tests
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install apt dependencies
        run: sudo apt-get install -y libasound2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Check the vendored Vue sheet mirrors
        # The Rust crate compiles the same sheets the Vue library ships; a
        # mirror that drifted from packages/vue/src is a styling divergence
        # with no compile error of its own.
        run: python3 scripts/sync-vue-mirror.py --check

      - name: Run cargo test
        run: cargo test --all-features --all
        env:
          RUSTFLAGS: '--cfg releasing'

      - name: Check wasm32-wasip2 target
        run: cargo check --workspace --all-features --target wasm32-wasip2
        env:
          RUSTFLAGS: '--cfg releasing'
