name: CNB Overflow Lane

# Parallel CI lane: every PR push also runs cargo-check on CNB cloud (cnb.cool) via the
# org ci-farm dispatch pipeline; the result lands as a cnb/cargo-check commit status on
# the PR head. This relieves the 4-slot self-hosted farm with a second, independent
# result lane. Architecture record: celestia-devtools PR #116 / #117.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Commit SHA (empty = PR head / branch head)'
        type: string
        default: ''

permissions:
  statuses: write
  actions: read

concurrency:
  group: cnb-overflow-lane-pr-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  lane:
    uses: celestia-island/celestia-devtools/.github/workflows/cnb-overflow.yml@2e76d373762dc6b36c1ab7625c1c34842c28ad4a
    with:
      # NO `devtools-ref:` here: cnb-overflow.yml never declared that input
      # (unlike verify-versions / pr-title-check / commit-msg-lint callees),
      # so passing it made every run fail at startup with 0 jobs — the lane
      # was dead from 2026-10-30 (#919) until this fix. The pin is on the
      # `uses:` line above; that is the only place the callee ref belongs.
      target_repo: hikari
      target_sha: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
      task: cargo-check
      lane: pr-${{ github.event.pull_request.number || 'manual' }}
      queue_threshold: 3
      poll_minutes: 10
    secrets: inherit
