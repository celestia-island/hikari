name: CNB Overflow Lane

on:
  # Overflow/mirror sync: runs after a squash merge and on demand, never on the
  # pull request (2026-11-06 trigger policy).
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA (empty = branch head)"
        type: string
        default: ""
permissions:
  statuses: write
  actions: read

concurrency:
  group: cnb-overflow-lane-pr-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  lane:
    uses: celestia-island/celestia-devtools/.github/workflows/cnb-overflow.yml@bcf5ed8f3caebe8dbf0a528ab9deecb6d42cf211
    with:
      target_repo: ${{ github.event.repository.name }}
      target_sha: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
      task: cargo-check
      lane: pr-${{ github.event.pull_request.number || 'manual' }}
      queue_threshold: 3
      poll_minutes: 10
    secrets: inherit
