name: Coverage

on:
  workflow_dispatch:
  # NO `pull_request:` — llvm-cov EXECUTES the whole workspace suite under
  # instrumentation (nightly), which was a second full-suite run per PR on top
  # of `Tests`. Coverage is a master-quality signal, not a PR gate: the same
  # assertions already run once per PR on stable in the `Tests` workflow, and the
  # farm's 4–6 worker slots queue 38–77 minutes for the work that does run.

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    # Master-only by design (see `on:`): llvm-cov EXECUTES the workspace suite
    # under instrumentation, so a per-PR run would be a second full-suite
    # execution of the same tree.
    name: Test Coverage
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Cache MDI icons
        id: mdi-cache
        uses: actions/cache@v6
        with:
          path: icons/mdi
          key: mdi-icons-v1

      - name: Fetch MDI icons
        if: steps.mdi-cache.outputs.cache-hit != 'true'
        run: python3 scripts/icons/fetch_mdi_icons.py

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Generate coverage report (HTML + lcov)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --html

      - name: Summarize coverage
        run: |
          cargo llvm-cov --workspace --summary-only 2>&1 | tee coverage-summary.txt
          echo ""
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n +1 coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
            target/llvm-cov/html/
          retention-days: 30