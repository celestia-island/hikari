name: npm Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @celestia-island/hikari to npm
    runs-on: ubuntu-latest
    steps:
      # Full history: the tag-provenance guard below compares the tagged commit
      # against origin/master, and a shallow clone cannot answer that question.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # S2-1 guard (2026-10-25, structural audit SR-15): the v* npm line has 303
      # tags, 16 of them not ancestors of master — tags were pushed on PR
      # branches before the squash merge. Such a tag names a commit that is not
      # on the release branch, so the artifact cannot be reproduced from master.
      # Dispatch remains the escape hatch for a deliberate back-fill.
      - name: Ensure the release tag is on master
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/master — release tags must point at a squash-merged master commit (AGENTS [[change]])"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is on master"

      # Resolved up front, before the heavy steps: the dispatch tree check
      # below needs it, and a bad dispatch must die in seconds rather than
      # after two Vitest shards. (Moved up from below the suite; content
      # unchanged.)
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing @celestia-island/hikari@$v"

      # Dispatch pin (org rule 4, version slots move only in release PRs):
      # dispatch checkouts default to master HEAD — no tag selects the tree —
      # so pin the requested version coordinate to a tree that already
      # declares it before anything expensive runs. Without this, the "Bump
      # version" step below would silently rewrite packages/vue/package.json
      # and publish a version that never existed in git (36 patch numbers were
      # burned by dispatch typos). The tag lane skips this: its checkout IS
      # the tagged tree by construction.
      - name: Verify the tree carries the version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          declared="$(python3 -c 'import json; print(json.load(open("packages/vue/package.json"))["version"])')"
          if [ "$declared" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::dispatch version ${{ steps.ver.outputs.version }} does not match the checked-out tree: packages/vue/package.json declares $declared — dispatch publishes run on master HEAD, so the version must land in a release PR first (org rule 4)"
            exit 1
          fi
          echo "tree declares $declared, matching the requested version"

      # Dispatch publishes run only from a provenance tag (org rule 4): the
      # tag-push lane is the primary publisher and this lane is its retry. An
      # earlier draft minted the tag AFTER publish - rejected: pushing a v* tag
      # from this workflow re-triggers this file's own tag-push lane against an
      # already-published version, which burns a full shard run and dies on the
      # S1-2 guard. Requiring the tag first keeps the lane append-only with no
      # red re-entry, and no contents: write grant is needed here at all.
      - name: Require the provenance tag on this commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/v${{ steps.ver.outputs.version }}"
          tag_commit="$(git rev-parse "FETCH_HEAD^{commit}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::dispatch retries the TAG lane, whose tag must point at the checked-out commit: v${{ steps.ver.outputs.version }} tags $tag_commit, but this run is on $GITHUB_SHA. Re-run the tag lane's workflow run, or push a fresh release tag."
            exit 1
          fi
          echo "provenance tag v${{ steps.ver.outputs.version }} points at this commit"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: |
          cd packages/vue
          pnpm install --frozen-lockfile

      # The package also ships the jco bindings under packages/vue/src/wasm/**,
      # which are no longer checked in — build them before anything looks at
      # the tree. `prepublishOnly` (check_npm_pack.py) refuses a publish whose
      # tarball would lack them; this step is what makes that guard pass.
      - name: Setup Rust (wasm32-wasip2)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build wasm bindings
        run: |
          # `node`/`npm` ship on this runner; jco needs a Node >= 20, which every
          # job here already provides (setup-node 24, or the self-hosted default).
          command -v jco >/dev/null || npm install --global @bytecodealliance/jco@1
          python3 packages/wasm/build.py

      # The Vue package ships as source; its Vitest suite (happy-dom) is the
      # only automated behavioral gate for it, so a release must never go out
      # with a red suite. Type check runs via prepublishOnly on `npm publish`.
      # SHARDED, and the sharding is load-bearing (2026-11-23, v0.55.468):
      # the suite has a memory regression on master (bisected by exclusion:
      # `HkModal.test.tsx` is the tipping file), so a worker that walks ~145
      # files accumulates past 6 GB. Raising the heap alone does not help —
      # the runner has 4 vCPUs and 16 GB, so 4 workers x 8 GB cannot fit and
      # the run still dies inside `Ineffective mark-compacts` (it did, with
      # the OOM then corrupting a focus-trap assertion in another worker).
      # Two sequential shards halve what any single worker walks, which is
      # the only shape that fits this box. The gate is unchanged: every
      # shard must pass, and the union is the same 581 files / 6904 tests
      # the single invocation walked.
      - name: Run Vitest suite (shard 1 of 2)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cd packages/vue
          pnpm exec vitest run --shard=1/2

      - name: Run Vitest suite (shard 2 of 2)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cd packages/vue
          pnpm exec vitest run --shard=2/2

      # S1-2 guard (2026-09-27): the v* tag namespace historically triggered
      # BOTH release lines, and npm had no floor check — a crates-style
      # v0.3.x tag would have published 0.3.x to npm and dragged `latest`
      # back by a year. The guard fails the job unless the version is
      # strictly newer than the registry's latest (network failures fail
      # closed too), and the selftest keeps the comparison logic honest.
      - name: Release guard (no downgrades)
        shell: bash
        run: |
          python3 scripts/release_guard.py --selftest
          python3 scripts/release_guard.py --registry npm \
            --package @celestia-island/hikari \
            --version "${{ steps.ver.outputs.version }}"

      - name: Bump version
        shell: bash
        run: |
          cd packages/vue
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: |
          cd packages/vue
          npm publish --access public --provenance

