name: npm Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @celestia-island/hikari to npm
    runs-on: ubuntu-latest
    steps:
      # Full history: the tag-provenance guard below compares the tagged commit
      # against origin/master, and a shallow clone cannot answer that question.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # S2-1 guard (2026-10-25, structural audit SR-15): the v* npm line has 303
      # tags, 16 of them not ancestors of master — tags were pushed on PR
      # branches before the squash merge. Such a tag names a commit that is not
      # on the release branch, so the artifact cannot be reproduced from master.
      # Dispatch remains the escape hatch for a deliberate back-fill.
      - name: Ensure the release tag is on master
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/master — release tags must point at a squash-merged master commit (AGENTS §4)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is on master"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: |
          cd packages/vue
          pnpm install --frozen-lockfile

      # The Vue package ships as source; its Vitest suite (happy-dom) is the
      # only automated behavioral gate for it, so a release must never go out
      # with a red suite. Type check runs via prepublishOnly on `npm publish`.
      - name: Run Vitest suite
        run: |
          cd packages/vue
          pnpm test

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing @celestia-island/hikari@$v"

      # S1-2 guard (2026-09-27): the v* tag namespace historically triggered
      # BOTH release lines, and npm had no floor check — a crates-style
      # v0.3.x tag would have published 0.3.x to npm and dragged `latest`
      # back by a year. The guard fails the job unless the version is
      # strictly newer than the registry's latest (network failures fail
      # closed too), and the selftest keeps the comparison logic honest.
      - name: Release guard (no downgrades)
        shell: bash
        run: |
          python3 scripts/release_guard.py --selftest
          python3 scripts/release_guard.py --registry npm \
            --package @celestia-island/hikari \
            --version "${{ steps.ver.outputs.version }}"

      - name: Bump version
        shell: bash
        run: |
          cd packages/vue
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: |
          cd packages/vue
          npm publish --access public
