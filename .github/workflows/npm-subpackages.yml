name: npm Sub-packages

# Sub-packages carry their own version lines (webui-shared 0.1.x vs the
# vue package's 0.55.x), so they cannot ride a v* tag: the tag names one
# version. This lane publishes whatever sub-package version is not yet on
# the registry, on demand — idempotent, so a retry after a permissions
# fix costs nothing and a re-run with nothing new to ship is a no-op.
#
# npm-side prerequisite (no NODE_AUTH_TOKEN is injected anywhere in this
# repo — publishing rides OIDC trusted publishing): each package must have
# a trusted publisher naming THIS workflow file. hikari is registered
# against npm-release.yml; a sub-package first published from here needs
# its own entry, and a brand-new package cannot be created by OIDC at all
# — that first publish takes a human. The binding is repo + workflow
# filename + optional npm "environment"; this job declares no environment,
# which is only correct if the npm side left it empty too. A 404 on PUT
# means "no package / no trusted publisher"; a 403 means the OIDC token
# was minted but rejected — check the workflow filename and environment
# before reading either as a code bug.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "One directory name under packages/ to publish, e.g. webui_shared (default: every publishable sub-package)"
        required: false
        default: ""

# One dispatch at a time: two in flight would interleave a multi-package
# run and leave it half-published. Serialising does NOT order by version —
# a late dispatch for an older ref still runs — so the floor below (the
# shared release_guard) is what actually keeps `latest` from moving
# backwards.
concurrency:
  group: npm-subpackages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish sub-packages to npm
    runs-on: ubuntu-latest
    # A stuck run holds the concurrency group; GitHub's default is six
    # hours. Publishing a source-only package takes seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same guard the main lane carries: an artifact must be reproducible
      # from master, so the dispatched ref has to be on it.
      - name: Ensure the dispatched ref is on master
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/master — publish only from a squash-merged master commit"
            exit 1
          fi
          echo "$GITHUB_SHA is on master"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Publish every sub-package whose version is not on the registry
        env:
          ONLY: ${{ github.event.inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          # The guard's own docstring says release workflows run this before
          # the live check: a regression in its comparison logic turns the
          # release red instead of silently disarming the floor.
          python3 scripts/release_guard.py --selftest
          published=0
          matched=0
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -e "console.log(require('./$dir/package.json').name)")
            is_private=$(node -e "console.log(require('./$dir/package.json').private === true)")
            # The vue package is the main lane's business; a private package
            # is never published by definition; anything else under
            # packages/ is internal (mockups, fixtures) until it says
            # otherwise in this list.
            case "$name" in
              @celestia-island/hikari)
                echo "$name: the main lane publishes it — skipping"
                continue
                ;;
              @celestia-island/webui-shared) ;;
              *)
                echo "$name: not a published sub-package — skipping"
                continue
                ;;
            esac
            if [ "$is_private" = "true" ]; then
              echo "$name: private — skipping"
              continue
            fi
            if [ -n "${ONLY:-}" ] && [ "$dir" != "packages/$ONLY/" ]; then
              echo "$name: filtered out by the package input"
              continue
            fi
            matched=$((matched + 1))
            # Read the version only now, so an internal package that never
            # gets here cannot fail the run. A missing version prints
            # `undefined`, a non-empty string that would make `npm view
            # name@` resolve `latest` and skip silently — let node fail.
            if ! ver=$(node -e "const v=require('./$dir/package.json').version; if(!v) process.exit(2); console.log(v)"); then
              echo "::error::$name has no version in $dir/package.json"
              exit 1
            fi
            # A registry lookup answers three ways, and only one of them
            # means "go publish": E404 = the version is absent. Any other
            # failure (network, auth, 5xx) must stop the run — treating it
            # as "absent" would turn every blip into a red publish attempt
            # that npm then refuses with E403.
            if lookup=$(npm view "$name@$ver" version 2>&1); then
              echo "$name@$ver is already on the registry — skipping"
              continue
            fi
            if ! printf '%s' "$lookup" | grep -qE 'E404|404 Not Found'; then
              echo "::error::registry lookup for $name@$ver failed: $lookup"
              exit 1
            fi
            # Same floor the main lane enforces (structural scan S1-2): a
            # version older than npm's `latest` must never be published, or
            # `latest` moves backwards and later green runs (already-
            # published → skip) never correct it. Fail-closed offline.
            # The guard answers "is this newer than latest?" and exits 1 for
            # "no, so don't" and 2 for "I could not even ask". The two need
            # different advice: for a package the registry has never seen,
            # the dist-tags endpoint answers 401 and exit 2 is the fleet's
            # normal first-publish path, not an outage. Nothing publishes
            # either way — the publish is below this line.
            set +e
            python3 scripts/release_guard.py --registry npm \
              --package "$name" --version "$ver"
            guard_rc=$?
            set -e
            case "$guard_rc" in
              0) ;;
              1) echo "::error::$name@$ver was refused by the version floor: it is not newer than the registry's latest (or is not a valid version). Bump the version; a deliberate maintenance-line release needs --allow-downgrade on the guard."
                 exit 1 ;;
              *) echo "::error::the version floor could not establish $name's current version (guard exit $guard_rc). For a package the registry has never seen that is expected — dist-tags answers 401 for an unknown name, and OIDC cannot create a package: publish it once by hand, then register this workflow as its trusted publisher (see the header). Otherwise the guard could not reach the registry."
                 exit 1 ;;
            esac
            echo "publishing $name@$ver"
            ( cd "$dir" && npm publish --access public --provenance )
            published=$((published + 1))
          done
          # A filter that matches nothing is a typo, not a no-op: silently
          # exiting 0 would read as "already published" to whoever dispatched.
          if [ -n "${ONLY:-}" ] && [ "$matched" -eq 0 ]; then
            echo "::error::the package input '$ONLY' matched no published sub-package"
            exit 1
          fi
          echo "published $published package(s)"
