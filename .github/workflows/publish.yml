name: Publish to crates.io
on:
  push:
    # S1-2 (2026-09-27): the crates line gets its own tag namespace. The
    # historical shared `v*` prefix let every npm tag (v0.55.*) also trigger
    # this workflow, which then published "whatever the workspace declares"
    # regardless of the tag — a bump that was not meant for release yet
    # would ship early, and the two lines could masquerade as each other.
    # npm keeps `v*` (62 historical tags); crates releases tag `cargo-v0.3.x`.
    tags: ["cargo-v*"]
  workflow_dispatch:

jobs:
  verify-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract tag version
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cargo-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/cargo-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check all publishable packages match the workspace line
        run: |
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          ROOT_VER=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          FAIL=0
          # A tag ref whose cargo-v prefix carries no version (glob `*`
          # matches empty) must not fall into the dispatch semantics.
          if [[ "$GITHUB_REF" == refs/tags/* && -z "$TAG_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF carries no version after the cargo-v prefix"
            FAIL=1
          fi
          if ! [[ "$ROOT_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::workspace version ($ROOT_VER) is not a valid semver version"
            FAIL=1
          fi
          # A tag must name exactly the version it releases; the workspace
          # version must never be published under a tag from another line.
          if [ -n "$TAG_VERSION" ] && [ "$ROOT_VER" != "$TAG_VERSION" ]; then
            echo "::error::tag cargo-v$TAG_VERSION does not match the crates workspace version ($ROOT_VER) — bump Cargo.toml and re-tag"
            FAIL=1
          fi
          PACKAGES=(
            "hikari-palette:packages/palette"
            "hikari-animation:packages/animation"
            "hikari-theme:packages/theme"
            "hikari-icons:packages/icons"
            "hikari-components:packages/components"
          )
          for ENTRY in "${PACKAGES[@]}"; do
            PKG="${ENTRY%%:*}"
            DIR="${ENTRY##*:}"
            CARGO_TOML="$DIR/Cargo.toml"
            if [ ! -f "$CARGO_TOML" ]; then
              echo "::error::$CARGO_TOML not found"
              FAIL=1
              continue
            fi
            VER=$(grep -oP '^version\s*=\s*"\K[^"]+' "$CARGO_TOML" 2>/dev/null || true)
            if [ -z "$VER" ]; then
              VER=$(grep -oP 'version\.workspace\s*=\s*true' "$CARGO_TOML" >/dev/null 2>&1 && echo "workspace" || echo "MISSING")
            fi
            if [ "$VER" = "workspace" ]; then
              echo "::notice::$PKG uses workspace version ($ROOT_VER) — OK"
            elif [ "$VER" = "$ROOT_VER" ]; then
              echo "::notice::$PKG version ($VER) matches the workspace line — OK"
            else
              echo "::error::$PKG version ($VER) != workspace version ($ROOT_VER) in $CARGO_TOML"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Version verification failed."
            exit 1
          fi
          echo "All packages resolve to workspace version $ROOT_VER"
      - name: Release guard (no downgrades)
        run: |
          ROOT_VER=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          python3 scripts/release_guard.py --selftest
          python3 scripts/release_guard.py --registry crates \
            --crate hikari-palette --version "$ROOT_VER"

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-versions

    steps:
      - uses: actions/checkout@v7

      - name: Ensure tag is on master
        run: |
          git fetch origin master --depth=1
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tag must be on master branch to publish"
            exit 1
          fi

      - name: Cache MDI icons
        id: mdi-cache
        uses: actions/cache@v6
        with:
          path: icons/mdi
          key: mdi-icons-v1

      - name: Fetch MDI icons
        if: steps.mdi-cache.outputs.cache-hit != 'true'
        run: python3 scripts/icons/fetch_mdi_icons.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate icon data
        run: cargo build -p hikari-icons

      - name: Strip examples from workspace to avoid git-dep conflicts
        run: |
          pip install tomlkit
          python3 -c "
          import tomlkit, os
          with open('Cargo.toml') as f: d = tomlkit.load(f)
          d['workspace']['members'] = [m for m in d['workspace']['members'] if not m.startswith('examples/')]
          tmp = 'Cargo.toml.tmp'
          with open(tmp, 'w') as f: tomlkit.dump(d, f)
          os.replace(tmp, 'Cargo.toml')
          "

      - run: cargo login ${{ secrets.CRATES_IO_API_TOKEN }}

      - name: Skip if already published
        id: check-exists
        run: |
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "::warning::Version ${VERSION} already published — skipping."
            exit 78
          fi
        env:
          CRATE: hikari-palette

      - run: python3 scripts/publish_crates.py
