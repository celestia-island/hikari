name: Release Notes

on:
  # Release line: tags stay exactly as before; the manual entry is the only
  # addition (2026-11-06 trigger policy — releases are never PR-driven).
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  release-notes:
    permissions:
      contents: write
    uses: celestia-island/celestia-devtools/.github/workflows/release-notes.yml@c45f1881e00cb55d0a2a1fcf57b28734ece119bb
    with:
      devtools-ref: c45f1881e00cb55d0a2a1fcf57b28734ece119bb
