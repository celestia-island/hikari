name: Release Notes

on:
  # Release line: tags stay exactly as before; the manual entry is the only
  # addition (2026-11-06 trigger policy — releases are never PR-driven).
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  release-notes:
    permissions:
      contents: write
    uses: celestia-island/celestia-devtools/.github/workflows/release-notes.yml@bcf5ed8f3caebe8dbf0a528ab9deecb6d42cf211
    with:
      devtools-ref: bcf5ed8f3caebe8dbf0a528ab9deecb6d42cf211
