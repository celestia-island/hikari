name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: cargo audit
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo audit
        run: cargo install --locked cargo-audit && cargo audit

  deny:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: cargo deny
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      # Runner hosts carry no ambient cargo on PATH; the audit job above already
      # pays for a toolchain step, and this job died with `cargo: command not
      # found` without one (2026-11-03, both farm nodes).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        # Version-pinned guard (same pattern as tairitsu audit.yml): an unknown
        # older cargo-deny on a warm runner would be reused forever, and an
        # unpinned cold install drifts the deny.toml schema under us.
        run: |
          cargo deny --version 2>/dev/null | grep -q ' 0\.20\.2' \
            || cargo install cargo-deny --version 0.20.2 --locked --force

      - name: Run cargo deny
        run: cargo deny check
