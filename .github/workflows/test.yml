name: Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    # This is now the ONLY unfiltered-when-matched suite lane, so the filter
    # has to cover everything that can change the result. The old `ci.yml`
    # `test` job had no filter at all; without these entries a PR touching only
    # scripts/**, res/**, tests/** (visual baselines) or the toolchain pin ran
    # zero suite executions.
    paths:
      - '.github/workflows/**'
      - 'packages/**/*'
      - 'examples/**/*'
      - 'scripts/**/*'
      - 'res/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'justfile'
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Test
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    # Exactly one full-suite run per pull request, on stable. The nightly leg
    # re-ran the identical tree for no extra signal: nightly correctness is
    # covered by the static lanes (clippy.yml runs stable+nightly, fmt.yml runs
    # nightly). The farm has 4-6 worker slots and PR jobs queue 38-77 minutes,
    # so a duplicate suite run buys queue depth, not confidence.
    # The matrix is kept with a single leg on purpose: the job name stays
    # `Test (stable)` and the `matrix.toolchain` reference below stays valid.
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable

    steps:
      - uses: actions/checkout@v7

      - name: Cache MDI icons
        id: mdi-cache
        uses: actions/cache@v6
        with:
          path: icons/mdi
          key: mdi-icons-v1

      - name: Fetch MDI icons
        if: steps.mdi-cache.outputs.cache-hit != 'true'
        run: python3 scripts/icons/fetch_mdi_icons.py

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run tests
        # `--all-features` on purpose: the deleted `ci.yml` test job was the only
        # lane that executed the feature-gated tests (15 `#[test]` fns behind
        # `tauri` in packages/host), and the old recipe ran `cargo test --workspace`
        # (default features only). One lane, but the widest one.
        run: cargo test --workspace --all-features