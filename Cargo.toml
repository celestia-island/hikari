[workspace]
members = [
    "packages/wasm/qr",
    "packages/wasm/mermaid",
    "packages/wasm/scene3d",
    "packages/wasm/highlight",
    "packages/palette",
    "packages/theme",
    "packages/animation",
    "packages/components",
    "packages/icons",
    "packages/builder",
    "packages/host",
    "packages/i18n",
]

resolver = "2"

exclude = [
    "examples/*",
    "packages/vue",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
authors = ["Hikari Contributors"]
license-file = "LICENSE"
repository = "https://github.com/celestia-island/hikari"

# ------
# Hikari build-time configuration
# ------
#
# Each Hikari crate reads its own subtable here. The crate's build.rs turns the
# declared values into `cargo:rustc-cfg` flags, so selection is a property of
# the consuming workspace — no Cargo features involved.
#
#   [workspace.metadata.hikari.palette]
#   collections = ["chinese"]            # which color catalogs to compile in
#
#   [workspace.metadata.hikari.icons]
#   set = ["chevron-left", "menu", ...]  # explicit icon list (omit = auto-discover)
#   dynamic-fetch = true                # fetch icons at runtime instead of embedding
[workspace.metadata.hikari.palette]
collections = ["chinese", "tailwind"]

[workspace.metadata.hikari.icons]
# When `set` is omitted, hikari-icons auto-discovers used icons by scanning
# the workspace source. Set it explicitly to pin a known set, e.g.:
#   set = ["chevron-left", "menu", "close"]
dynamic-fetch = false

[workspace.dependencies]
# ------
# Basic language and tools
# ------
anyhow = "^1"
include_dir = "^0.7"

# ------
# Data and serialization
# ------
# Date/time. Replaces `chrono` (RUSTSEC-2026-0543, unmaintained).
#
# `serde` is kept even though no hikari type serializes a date today: the
# components are published, so a consumer that puts a `Timestamp` on its own
# wire keeps the standard RFC 3339 shape without asking us for a feature.
#
# `js` is load-bearing and must stay. Without it jiff PANICS on
# `wasm32-unknown-unknown` — the target the browser build of these components
# actually compiles for — because `std` has no clock there:
# jiff-1.0.2 `src/now.rs` panics outright rather than letting `std` do it.
# With it, the browser build reads the real clock through `js-sys`, which is
# what `chrono`'s `wasmbind` clock did before this migration (`js-sys` is
# already in the browser closure for other reasons, so this edge is free).
# Dropping the feature still compiles and still passes every native test (the
# panic is a wasm-only runtime path), so nothing except this comment protects
# it.
# It is inert off-wasm: jiff gates the whole path on
# `target_arch = "wasm32"` + `target_os = "unknown"`, so the wasip2 closure
# does not grow `wasm-bindgen`.
#
# There is no `unstable-locales` counterpart on purpose — jiff ships no locale
# catalogue, and the calendar vocabulary has come from `hikari_i18n::dates`
# (CLDR) since #1454, so chrono's `LC_TIME` mirror was already dead.
jiff = { version = "^1", features = ["serde", "js"] }
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1" }
ron = "^0.8"

# ------
# Async runtime
# ------

# ------
# Logging and tracing
# ------

# ------
# Server-side dependencies (for SSR)
# ------

# ------
# Data serialization and processing
# ------

# ------
# Profile settings
# ------
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
