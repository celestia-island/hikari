[package]
name = "hikari-animation"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Animation hooks, easing functions and transition utilities for the Hikari design system"
repository.workspace = true
license-file.workspace = true
keywords = ["animation", "easing", "tween", "state-machine", "design-system"]
categories = ["gui", "wasm"]

[dependencies]
# Core dependencies
slotmap = "^1.0"

# Tairitsu framework integration. The whole workspace moves to the 0.6.0
# crates line together (`packages/components/Cargo.toml` says why).
# Local development redirects these to working copies via ~/.cargo/config.toml [patch.crates-io].
tairitsu-vdom = "^0.6.0"
tairitsu-hooks = "^0.6.0"
tairitsu-macros = "^0.6.0"
tairitsu-style = "^0.6.0"

# WASM dependencies (for the wasm feature), gated on the browser target.
#
# These live in a target table, not in `[dependencies]` behind `optional = true`,
# because optionality is decided by a *feature* and Cargo resolves features
# package-wide — it never splits them across `--target`. Anything a wasip2
# consumer enables would therefore drag web-sys into the guest closure. The
# browser target is the only place these crates can be used at all, so the
# target is the correct gate (D6: the wasip2 delivery closure stays bindgen-free).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "^0.2", optional = true }
web-sys = { version = "^0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "console",
    "DomRect",
    "MouseEvent",
    "CssStyleDeclaration",
    "Performance",
    "MediaQueryList",
    "DomTokenList",
] }
js-sys = { version = "^0.3", optional = true }

[features]
default = []
# The `dep:` entries stay: the crates are still optional, so the feature is what
# turns them on for the browser build. On any other target the same feature
# resolves against an empty table, which is exactly the point.
wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
