[package]
name = "hikari-components"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "Core UI components (buttons, inputs, tables, modals) for the Hikari design system"

[lib]
doctest = false

[features]
default = ["basic", "feedback", "navigation", "layout", "data", "display", "entry", "production"]

# Component groups (shortcuts) - the only features the module tree actually
# gates on (`src/styled.rs` registers component groups per feature).
#
# Fine-grained per-component features (button, input, …, spotlight) were
# removed: nothing in `src/` was gated on them, so enabling them silently
# changed nothing (and `spotlight` had no component at all). Reintroduce
# per-component features only together with real `cfg(feature = …)` gating.
basic = []
feedback = []
navigation = []
layout = []
data = []
display = []
entry = []
production = []

[dependencies]
# Hikari design system
hikari-palette = { version = "^0.3", path = "../palette" }
hikari-theme = { version = "^0.3", path = "../theme" }
hikari-animation = { version = "^0.3", path = "../animation", default-features = false, features = ["wasm"] }
hikari-icons = { version = "^0.3", path = "../icons", default-features = false, features = ["tairitsu"] }
hikari-i18n = { version = "^0.3", path = "../i18n" }

# Tairitsu framework (replaces Dioxus (legacy compat))
# Local development redirects these to working copies via ~/.cargo/config.toml [patch.crates-io].
# Floor 0.5.18: first tairitsu release whose scss! macro honours `no_hash` —
# every component stylesheet passes `no_hash`, and older macros silently
# hashed (or corrupted) them, leaving components without any styling.
tairitsu-vdom = "^0.5.18"
tairitsu-hooks = "^0.5.18"
tairitsu-macros = "^0.5.18"
tairitsu-style = "^0.5.18"

# Global static variables
once_cell = "^1.19"

# QR code generation
qrcode = "^0.14"

# Date/time handling
chrono = { workspace = true }

# Browser WASM-specific dependencies (not for WASI)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "^0.2"
js-sys = "^0.3"
web-sys = { version = "^0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "MutationObserver", "MutationObserverInit", "ResizeObserver",
    "ScrollToOptions", "ScrollBehavior",
    "CssStyleDeclaration",
    "console",
    "MouseEvent", "Event", "NodeList",
    "DomRect",
    "DomTokenList",
    "EventTarget",
] }

[build-dependencies]
grass = "^0.13"
anyhow = "^1"

