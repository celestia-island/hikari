[package]
name = "hikari-components"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "Core UI components (buttons, inputs, tables, modals) for the Hikari design system"

[lib]
doctest = false

[features]
default = ["basic", "feedback", "navigation", "layout", "data", "display", "entry", "production", "overlay", "auth", "scene", "theme"]

# Component groups (shortcuts) - the only features the module tree actually
# gates on (`src/styled.rs` registers component groups per feature).
#
# Fine-grained per-component features (button, input, …, spotlight) were
# removed: nothing in `src/` was gated on them, so enabling them silently
# changed nothing (and `spotlight` had no component at all). Reintroduce
# per-component features only together with real `cfg(feature = …)` gating.
basic = []
feedback = []
navigation = []
layout = []
data = []
display = []
entry = []
production = []
overlay = []
auth = []
scene = []
theme = []

[dependencies]
# Hikari design system
hikari-palette = { version = "^0.5", path = "../palette" }
hikari-theme = { version = "^0.5", path = "../theme" }
hikari-animation = { version = "^0.5", path = "../animation", default-features = false, features = ["wasm"] }
hikari-icons = { version = "^0.5", path = "../icons", default-features = false, features = ["tairitsu"] }
hikari-i18n = { version = "^0.5", path = "../i18n" }

# Tairitsu framework (replaces Dioxus (legacy compat))
# Local development redirects these to working copies via ~/.cargo/config.toml [patch.crates-io].
# Floor: the 0.5.26 release LINE (crates 0.5.26 + tairitsu-web 0.5.26 +
# glue 0.5.4). The four declared crates are byte-identical from 0.5.24 on —
# the behavioural floors live in tairitsu-web and the glue:
#   - glue 0.5.4: the `html-input-element` value getter (ChangeEvent.value
#     carries the real committed value);
#   - tairitsu-web 0.5.25: typed-`change` discrimination;
#   - tairitsu-web 0.5.26: the value read through `html_input_element`;
#   - tairitsu 0.5.18: `scss!` `no_hash` honouring (older macros silently
#     hashed or corrupted component stylesheets).
# Nothing enforces the tairitsu-web/glue pairing at package time: consumers
# must package the whole line together (ledger L127's failure mode).
tairitsu-vdom = "^0.5"
tairitsu-hooks = "^0.5"
tairitsu-macros = "^0.5"
tairitsu-style = "^0.5"

# Global static variables
once_cell = "^1.19"

# QR code generation
qrcode = "^0.14"

# Date/time handling
chrono = { workspace = true }

# Browser WASM-specific dependencies (not for WASI)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "^0.2"
js-sys = "^0.3"
web-sys = { version = "^0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "MutationObserver", "MutationObserverInit", "ResizeObserver",
    "ScrollToOptions", "ScrollBehavior",
    "CssStyleDeclaration",
    "console",
    "MouseEvent", "Event", "NodeList",
    "DomRect",
    "DomTokenList",
    "EventTarget",
] }

[build-dependencies]
grass = "^0.13"
anyhow = "^1"

