[package]
name = "hikari-components"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "Core UI components (buttons, inputs, tables, modals) for the Hikari design system"

[lib]
doctest = false

[features]
default = ["basic", "feedback", "navigation", "layout", "data", "display", "entry", "overlay", "auth", "scene", "theme"]

# Component groups (shortcuts) - the only features the module tree actually
# gates on (`src/styled.rs` registers component groups per feature).
#
# Fine-grained per-component features (button, input, …, spotlight) were
# removed: nothing in `src/` was gated on them, so enabling them silently
# changed nothing (and `spotlight` had no component at all). Reintroduce
# per-component features only together with real `cfg(feature = …)` gating.
basic = []
feedback = []
navigation = []
layout = []
data = []
display = []
entry = []
overlay = []
auth = []
scene = []
theme = []

[dependencies]
# Hikari design system
hikari-palette = { version = "^0.6", path = "../palette" }
hikari-icons = { version = "^0.6", path = "../icons", default-features = false, features = ["tairitsu"] }
hikari-i18n = { version = "^0.6", path = "../i18n" }

# Tairitsu framework (replaces Dioxus (legacy compat))
# Local development redirects these to working copies via ~/.cargo/config.toml [patch.crates-io].
# Floor: the 0.6.0 release LINE (crates 0.6.0 + tairitsu-web 0.6.0 + glue
# 0.6.1). The behavioural floors live in tairitsu-vdom, tairitsu-web and
# the glue:
#   - glue 0.5.4: the `html-input-element` value getter (ChangeEvent.value
#     carries the real committed value);
#   - tairitsu-web 0.5.25: typed-`change` discrimination;
#   - tairitsu-web 0.5.26: the value read through `html_input_element`;
#   - tairitsu 0.5.18: `scss!` `no_hash` honouring (older macros silently
#     hashed or corrupted component stylesheets);
#   - tairitsu-web 0.6.0: `WitPlatform::body()` and the two style getters
#     the wasip2 platform backend reads. The whole line moves with it:
#     `WitPlatform`'s element and event types are tairitsu-vdom 0.6.0's, so
#     a `^0.5` requirement next to it puts two `tairitsu-vdom`s in one graph.
# Nothing enforces the tairitsu-web/glue pairing at package time: consumers
# must package the whole line together (ledger L127's failure mode).
tairitsu-vdom = "^0.6.0"
tairitsu-hooks = "^0.6.0"
tairitsu-macros = "^0.6.0"
tairitsu-style = "^0.6.0"

# Global static variables
once_cell = "^1.19"

# QR code generation

# Date/time handling
jiff = { workspace = true }

# Browser WASM-specific dependencies (not for WASI)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Same gate as the wasm crates below: everything `hikari-animation` exposes past
# its pure-Rust core is browser-only, so a wasip2 consumer must not pull the edge.
# `features = ["wasm"]` is load-bearing and must stay — Cargo resolves features
# package-wide, never per target, so dropping it leaves the wasm32-unknown-unknown
# build without `hikari_animation::{timer,style,global_manager}` (measured: 14
# errors) while wasip2 stays green and hides the breakage.
hikari-animation = { version = "^0.6", path = "../animation", default-features = false, features = ["wasm"] }
wasm-bindgen = "^0.2"
js-sys = "^0.3"
web-sys = { version = "^0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "MutationObserver", "MutationObserverInit", "ResizeObserver",
    "ScrollToOptions", "ScrollBehavior",
    "CssStyleDeclaration",
    "console",
    "MouseEvent", "Event", "NodeList",
    "DomRect",
    "DomTokenList",
    "EventTarget", "AddEventListenerOptions",
] }

# Component (wasm32-wasip2) dependencies. On this target the browser is reachable
# only through tairitsu-web's WIT host world — a component never links web_sys —
# so the platform backend (`src/platform/wit.rs`) forwards to `WitPlatform`:
# `vdom` brings the platform traits, `wit-bindings` the generated host imports
# the component links against.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
# 0.6.0 is the first release whose `WitPlatform` exposes `body()` and the two
# style getters the backend reads.
tairitsu-web = { version = "^0.6.0", default-features = false, features = ["vdom", "wit-bindings"] }

[build-dependencies]

