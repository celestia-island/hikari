[package]
name = "hikari-theme"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "Theme context provider and CSS variables for the Hikari design system"

[lib]
doctest = false

[dependencies]
# Hikari palette
hikari-palette = { version = "^0.3", path = "../palette" }

# Tairitsu framework (for theme context)
# Local development redirects these to working copies via ~/.cargo/config.toml [patch.crates-io].
tairitsu-vdom = "^0.5"
tairitsu-hooks = "^0.5"
tairitsu-macros = "^0.5"
