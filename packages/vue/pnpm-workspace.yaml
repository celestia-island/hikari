packages:
  - '.'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
# Explicit base is required: pnpm 11's built-in release-age cutoff ignores
# this exclude list unless minimumReleaseAge itself is set (one day,
# matching the built-in default's intent — the shittim-chest convention).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # stage 3: the library-facing host client (hikari QR consumes it)
  - '@celestia-island/tairitsu-host-client@0.1.0'
  - '@vue/language-core@3.3.9'
  - vue-tsc@3.3.9
  - '@celestia-island/tairitsu-transport@0.1.0'
  # 0.2.0 same-day unification: the SSE open edge — one transport
  # instance tree-wide (chest already rides ^0.2; hikari joining kills
  # the 0.1/0.2 dual install).
  - '@celestia-island/tairitsu-transport@0.2.0'
overrides:
  typescript: ~6.0
  vue-tsc: ~3.3.9
