[package]
name = "hikari-wasm-mermaid"
version = "0.1.0"
license = "SySL-1.0"
edition.workspace = true
publish = false

[dependencies]
pest = "^2"
pest_derive = "^2"
unicode-width = "^0.2"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { version = "^0.57", features = ["macros"] }

[lib]
crate-type = ["cdylib", "rlib"]
